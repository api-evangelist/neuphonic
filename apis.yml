apis:
- name: Neuphonic TTS WebSocket API
  description: >
    WebSocket endpoint for continuous, low-latency text-to-speech streaming. Enables real-time voice synthesis
    with sub-25ms latency, supporting multiple text chunks over a single persistent connection. Includes
    a 60-second connection timeout and requires a STOP token to signal completion.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.neuphonic.com/build-group/text-to-speech
  baseURL: wss://api.neuphonic.com
  tags:
  - Text-to-Speech
  - WebSocket
  - Real-Time
  - Streaming
  properties:
  - type: Documentation
    url: https://docs.neuphonic.com/build-group/text-to-speech
  - type: AsyncAPI
    url: https://docs.neuphonic.com/api-reference/tts/websocket
- name: Neuphonic Voice Cloning API
  description: >
    REST API for creating and managing cloned voices. Accepts audio samples (MP3 or WAV, minimum 6 seconds,
    under 10MB) and generates a custom voice model. Supports creating, retrieving, updating, listing,
    and deleting cloned voices. Voice cloning is available in English, French, German, and Spanish.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.neuphonic.com/build-group/voice-cloning
  baseURL: https://api.neuphonic.com
  tags:
  - Voice Cloning
  - Audio
  - Machine-Learning
  tags_raw:
  - Voice Cloning
  - Audio
  - Machine Learning
  properties:
  - type: Documentation
    url: https://docs.neuphonic.com/build-group/voice-cloning
- name: Neuphonic Agent API
  description: >
    REST API for creating and managing conversational AI voice agents. Agents combine Neuphonic TTS with
    GPT-4o for interactive voice applications and support Model Context Protocol (MCP) server integration,
    multilingual operation, and interruption handling for natural conversational flow.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
